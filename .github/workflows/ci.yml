# Task N2 (docs/PHASE_3_PLAN.md): approved-test CI pipeline.
# Copy to .github/workflows/ci.yml AFTER Task N1 (N1 makes the unit tests pass on Linux).
# CI mode: runs approved Playwright tests only. No AI provider, MCP, or usage ledger (DEC-039).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  platform:
    name: Platform build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit

  approved-tests:
    name: Approved tests (SauceDemo, Release Demo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run approved SauceDemo tests
        run: npm run qa -- run --config project-data/saucedemo/project.config.json
      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: saucedemo-run-artifacts
          path: project-data/saucedemo/artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Start Release Demo V1
        run: |
          npm run demo:v1 > release-demo-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4310/ > /dev/null && exit 0
            sleep 1
          done
          echo "Release Demo did not answer on port 4310"; cat release-demo-server.log; exit 1
      - name: Run approved Release Demo tests
        run: npm run qa -- run --config project-data/release-demo/project.config.json
      - name: Upload Release Demo run reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-demo-run-artifacts
          path: project-data/release-demo/artifacts/
          if-no-files-found: ignore
          retention-days: 14
